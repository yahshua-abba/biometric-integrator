name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:
    # Manual build — produces downloadable artifacts only; no GitHub Release, no S3 upload.
    inputs:
      version:
        description: 'Version label for the build (e.g. 1.0.18-dev). Leave blank for 0.0.0-dev.'
        required: false
        default: ''

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build-macos:
    name: Build macOS DMG (Intel - Compatible with all Macs)
    runs-on: macos-15-intel  # Intel runner - works on Intel AND Apple Silicon (via Rosetta 2)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Compute build version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then VERSION="0.0.0-dev"; fi
          fi
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved build version: $VERSION"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Write VERSION file
        working-directory: ./backend
        run: |
          echo "$BUILD_VERSION" > VERSION

      - name: Build macOS app with PyInstaller
        working-directory: ./backend
        run: |
          pyinstaller --clean --distpath ../dist --workpath build sanbeda-integration.spec

      - name: Create DMG installer
        working-directory: ./backend
        run: |
          chmod +x create_dmg.sh
          ./create_dmg.sh "$BUILD_VERSION"

      - name: Upload DMG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-v${{ env.BUILD_VERSION }}
          path: dist/BiometricIntegration-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload DMG to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/BiometricIntegration-*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG to S3
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp dist/BiometricIntegration-*.dmg s3://yp-files/biometrics-integration/biometric-integration.dmg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-1

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Compute build version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = "${{ inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0-dev" }
          }
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Resolved build version: $version"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Create Windows ICO icon
        working-directory: ./icons
        run: |
          python -m pip install pillow
          python create_ico.py

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Write VERSION file
        working-directory: ./backend
        run: |
          Set-Content -Path VERSION -Value $env:BUILD_VERSION -NoNewline

      - name: Build Windows EXE with PyInstaller
        working-directory: ./backend
        run: |
          pyinstaller --clean --distpath ../dist --workpath build sanbeda-integration-windows.spec

      - name: Create ZIP archive
        working-directory: ./dist
        run: |
          Compress-Archive -Path BiometricIntegration.exe -DestinationPath "BiometricIntegration-v$env:BUILD_VERSION-Windows.zip"

      - name: Upload ZIP as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-v${{ env.BUILD_VERSION }}
          path: dist/BiometricIntegration-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows ZIP to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/BiometricIntegration-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows ZIP to S3
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp (Get-ChildItem dist/BiometricIntegration-*.zip).FullName s3://yp-files/biometrics-integration/biometric-integration.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-southeast-1
